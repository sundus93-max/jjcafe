{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJCafe — Google Sign In</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root{
      --cream:#f9f4ee;
      --caramel:#c8883a;
      --warm:#e8d5b7;
      --muted:#7a6050;
    }

    body{
      font-family:'Lato',sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(rgba(20,10,3,.72), rgba(20,10,3,.72)),
      url("{% static 'images/Background.png' %}") center/cover fixed;
    }

    .card{
      width:100%;
      max-width:420px;

      background:rgba(255,255,255,.07);
      backdrop-filter:blur(20px);

      border:1px solid rgba(200,136,58,.25);
      border-radius:20px;

      padding:40px;

      text-align:center;
    }

    h1{
      font-family:'Playfair Display',serif;
      color:var(--cream);
      margin-bottom:15px;
    }

    p{
      color:var(--muted);
      margin-bottom:30px;
      line-height:1.5;
    }

    .google-btn{
      width:100%;

      background:var(--caramel);
      color:white;

      border:none;
      border-radius:50px;

      padding:14px;

      cursor:pointer;

      font-weight:bold;
      font-size:.9rem;
    }

    .google-btn:hover{
      background:#a86d28;
    }

    .back{
      margin-top:20px;
    }

    .back a{
      color:var(--caramel);
      text-decoration:none;
    }
  </style>

</head>
<body>

<div class="card">

  <h1>Google Sign In</h1>

  <p>
    Continue with your Gmail account to access JJCafe.
  </p>

  <form method="post">
    {% csrf_token %}

    <button type="submit" class="google-btn">
      Continue with Google
    </button>
  </form>

  <div class="back">
    <a href="{% url 'home' %}">
      ← Back to JJCafe
    </a>
  </div>

</div>

</body>
</html>
