{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJCafe — Sign Out</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream:#f9f4ee; --espresso:#2b1a0e; --caramel:#c8883a; --warm:#e8d5b7; --muted:#7a6050; }
    body {
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(rgba(20,10,3,0.72), rgba(20,10,3,0.72)),
                  url("{% if branding.background_url %}{{ branding.background_url }}{% else %}{% static 'images/Background.png' %}{% endif %}") center/cover fixed;
    }
    .card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(200,136,58,0.25);
      border-radius: 20px;
      padding: 44px 40px 40px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      text-align: center;
      animation: slideUp 0.5s ease both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
    .logo img { width:72px; height:72px; border-radius:50%; border:2px solid var(--caramel); object-fit:cover; margin-bottom:16px; }
    h2 { font-family:'Playfair Display',serif; font-size:1.7rem; color:var(--cream); margin-bottom:10px; }
    p  { color:var(--muted); font-size:0.9rem; margin-bottom:28px; }
    .btn-signout {
      width:100%; background:var(--caramel); color:#fff; border:none;
      border-radius:50px; padding:14px; font-family:'Lato',sans-serif;
      font-size:0.85rem; font-weight:700; letter-spacing:0.12em;
      text-transform:uppercase; cursor:pointer; transition:background 0.2s,transform 0.2s;
    }
    .btn-signout:hover { background:#a86d28; transform:translateY(-2px); }
    .back-link { margin-top:20px; }
    .back-link a { color:var(--caramel); text-decoration:none; font-size:0.82rem; font-weight:700; }
    .back-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="{% if branding.logo_url %}{{ branding.logo_url }}{% else %}{% static 'images/logo.png' %}{% endif %}" alt="JJCafe"></div>
    <h2>Sign Out</h2>
    <p>Are you sure you want to sign out of your JJCafe account?</p>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn-signout">Yes, Sign Out</button>
    </form>
    <div class="back-link"><a href="{% url 'home' %}">← Stay & Go Back Home</a></div>
  </div>
</body>
</html>
