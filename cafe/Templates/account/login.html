{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJCafe — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream:#f9f4ee; --espresso:#2b1a0e; --caramel:#c8883a; --warm:#e8d5b7; --muted:#7a6050; }
    body {
      font-family: 'Lato', sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(rgba(20,10,3,0.72), rgba(20,10,3,0.72)),
                  url("{% if branding.background_url %}{{ branding.background_url }}{% else %}{% static 'images/Background.png' %}{% endif %}") center/cover fixed;
    }
    .card {
      width:100%; max-width:420px;
      background:rgba(255,255,255,0.07); backdrop-filter:blur(20px);
      border:1px solid rgba(200,136,58,0.25); border-radius:20px;
      padding:44px 40px 40px; box-shadow:0 24px 60px rgba(0,0,0,0.5);
      animation:slideUp 0.5s ease both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
    .logo { text-align:center; margin-bottom:28px; }
    .logo img { width:72px; height:72px; border-radius:50%; border:2px solid var(--caramel); object-fit:cover; margin-bottom:14px; }
    .logo h2 { font-family:'Playfair Display',serif; font-size:1.7rem; color:var(--cream); }
    .logo p  { font-size:0.82rem; color:var(--muted); letter-spacing:0.06em; margin-top:4px; }
    .error-msg { background:rgba(220,60,60,0.15); border:1px solid rgba(220,60,60,0.4); color:#ff9494; border-radius:10px; padding:10px 14px; font-size:0.85rem; margin-bottom:18px; text-align:center; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:0.74rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
    .form-group input { width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(200,136,58,0.22); border-radius:10px; padding:13px 16px; color:var(--cream); font-family:'Lato',sans-serif; font-size:0.95rem; outline:none; transition:border-color 0.2s; }
    .form-group input::placeholder { color:rgba(232,213,183,0.35); }
    .form-group input:focus { border-color:var(--caramel); background:rgba(255,255,255,0.12); }
    .login-btn { width:100%; background:var(--caramel); color:#fff; border:none; border-radius:50px; padding:14px; font-family:'Lato',sans-serif; font-size:0.85rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; margin-top:8px; transition:background 0.2s,transform 0.2s; }
    .login-btn:hover { background:#a86d28; transform:translateY(-2px); }
    .divider { display:flex; align-items:center; gap:12px; margin:22px 0; color:rgba(255,255,255,0.2); font-size:0.78rem; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.1); }
    .google-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:50px; padding:12px; color:var(--warm); font-size:0.85rem; font-weight:700; text-decoration:none; transition:background 0.2s; }
    .google-btn:hover { background:rgba(255,255,255,0.1); }
    .google-icon { width:18px; height:18px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold; color:#4285f4; }
    .back-link { text-align:center; margin-top:22px; }
    .back-link a { color:var(--caramel); text-decoration:none; font-size:0.82rem; font-weight:700; }
    .back-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="{% if branding.logo_url %}{{ branding.logo_url }}{% else %}{% static 'images/logo.png' %}{% endif %}" alt="JJCafe">
      <h2>Welcome Back</h2>
      <p>Sign in to your JJCafe account</p>
    </div>
    {% if form.errors %}
      <div class="error-msg">⚠ Invalid username or password. Please try again.</div>
    {% endif %}
    <form method="POST" action="{% url 'account_login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <div class="form-group">
        <label for="id_login">Username or Email</label>
        <input type="text" id="id_login" name="login" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" id="id_password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
    
    <div class="back-link" style="margin-top:14px">
      <a href="{% url 'account_signup' %}">Don't have an account? <b>Create one →</b></a>
    </div>
    <div class="back-link" style="margin-top:10px">
      <a href="{% url 'home' %}">← Back to JJCafe</a>
    </div>
  </div>
</body>
</html>
