{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJCafe — Manage Email</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream:#f9f4ee; --espresso:#2b1a0e; --caramel:#c8883a; --warm:#e8d5b7; --muted:#7a6050; }
    body { font-family:'Lato',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(rgba(20,10,3,0.72),rgba(20,10,3,0.72)), url("{% if branding.background_url %}{{ branding.background_url }}{% else %}{% static 'images/Background.png' %}{% endif %}") center/cover fixed; }
    .card { width:100%; max-width:440px; background:rgba(255,255,255,0.07); backdrop-filter:blur(20px); border:1px solid rgba(200,136,58,0.25); border-radius:20px; padding:40px; box-shadow:0 24px 60px rgba(0,0,0,0.5); }
    h2 { font-family:'Playfair Display',serif; font-size:1.5rem; color:var(--cream); margin-bottom:6px; }
    p  { color:var(--muted); font-size:0.85rem; margin-bottom:24px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:0.74rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .form-group input { width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(200,136,58,0.22); border-radius:10px; padding:12px 16px; color:var(--cream); font-size:0.95rem; outline:none; }
    .form-group input:focus { border-color:var(--caramel); }
    .btn { background:var(--caramel); color:#fff; border:none; border-radius:50px; padding:12px 28px; font-size:0.82rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.2s; }
    .btn:hover { background:#a86d28; }
    .back-link { margin-top:22px; text-align:center; }
    .back-link a { color:var(--caramel); text-decoration:none; font-size:0.82rem; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Manage Email</h2>
    <p>Update your email address below.</p>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Save Changes</button>
    </form>
    <div class="back-link"><a href="{% url 'home' %}">← Back to JJCafe</a></div>
  </div>
</body>
</html>
